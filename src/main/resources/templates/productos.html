<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SIGI - Inventario</title>
	<link rel="stylesheet" th:href="@{/css/estilos.css}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

	<aside class="sidebar">
		<div class="sidebar-brand">
			<span class="logo-dot"></span> SIGI
		</div>

		<div class="sidebar-menu">

		    <p class="menu-label">Principal</p>

		    <!-- Dashboard -->
		    <a th:if="${#authentication != null}"
		       th:href="@{/dashboard}"
		       class="menu-item">
		        <i class="fa-solid fa-table-cells-large"></i>
		        <span class="menu-text">Dashboard</span>
		    </a>

		    <!-- Inventario -->
		    <a th:if="${#authentication.authorities.![authority].contains('ROLE_ADMINISTRADOR')
		            or #authentication.authorities.![authority].contains('ROLE_ALMACEN')
		            or #authentication.authorities.![authority].contains('ROLE_GERENCIA')}"
		       th:href="@{/productos}"
		       class="menu-item activo">
		        <i class="fa-solid fa-cube"></i>
		        <span class="menu-text">Inventario</span>
		        <span class="badge-count" th:text="${totalProductos}"></span>
		    </a>

		    <!-- Alertas -->
		    <a th:if="${#authentication.authorities.![authority].contains('ROLE_ADMINISTRADOR') or #authentication.authorities.![authority].contains('ROLE_ALMACEN')}"
		       th:href="@{/productos/alertas}"
		       class="menu-item">
		        <i class="fa-regular fa-bell"></i>
		        <span class="menu-text">Alertas</span>
		    </a>

		    <p class="menu-label">Gestión</p>

		    <!-- Movimientos -->
		    <a th:if="${#authentication.authorities.![authority].contains('ROLE_ADMINISTRADOR') or #authentication.authorities.![authority].contains('ROLE_ALMACEN')}"
		       th:href="@{/movimientos}"
		       class="menu-item">
		        <i class="fa-solid fa-arrow-right-arrow-left"></i>
		        <span class="menu-text">Movimientos</span>
		    </a>

		    <!-- Proveedores -->
		    <a th:if="${#authentication.authorities.![authority].contains('ROLE_ADMINISTRADOR')
		            or #authentication.authorities.![authority].contains('ROLE_ALMACEN')}"
		       th:href="@{/proveedores}"
		       class="menu-item">
		        <i class="fa-solid fa-truck"></i>
		        <span class="menu-text">Proveedores</span>
		    </a>

		    <!-- Categorías -->
		    <a th:if="${#authentication.authorities.![authority].contains('ROLE_ADMINISTRADOR')}"
		       th:href="@{/categorias}"
		       class="menu-item">
		        <i class="fa-solid fa-tags"></i>
		        <span class="menu-text">Categorías</span>
		    </a>

		    <p class="menu-label">Análisis</p>

		    <!-- Reportes -->
		    <a th:if="${#authentication.authorities.![authority].contains('ROLE_ADMINISTRADOR')
		            or #authentication.authorities.![authority].contains('ROLE_GERENCIA')}"
		       th:href="@{/productos/reportes}"
		       class="menu-item">
		        <i class="fa-solid fa-chart-column"></i>
		        <span class="menu-text">Reportes</span>
		    </a>

		    <!-- Usuarios -->
		    <a th:if="${#authentication.authorities.![authority].contains('ROLE_ADMINISTRADOR')}"
		       th:href="@{/usuarios}"
		       class="menu-item">
		        <i class="fa-solid fa-users"></i>
		        <span class="menu-text">Usuarios</span>
		    </a>

		</div>

		<div class="sidebar-footer">
			<form th:action="@{/logout}" method="post" style="margin: 0;">
				<button type="submit" class="btn-logout"> <i class="fa-solid fa-right-from-bracket"></i>
					Cerrar sesión
				</button>
			</form>
		</div>
	</aside>

	<div class="main-wrapper">

		<header class="top-header">
			<div class="header-title">Plaza 4 — Gestión de Inventarios</div>
			<div class="header-user"> 
				<div class="avatar"th:text="${#strings.substring(usuario,0,1)}"> A</div> 
				<div class="user-info">
					<span th:text="${usuario}">  Administrador </span>
										 <small class="rol-usuario"
										        th:text="${rol}">
										     ADMINISTRADOR
										 </small>
				</div>
					 
			</div>
		</header>

		<main class="main-content">

			<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">

				<div>
					<h1 style="margin-bottom: 5px;">Inventario completo</h1>
					<p style="color: var(--texto-secundario); font-size: 0.9rem;"
						th:text="${totalProductos} + ' productos registrados en el sistema'"></p>
				</div>
				<a th:if="${#authentication.authorities.![authority].contains('ROLE_ADMINISTRADOR')}" th:href="@{/productos/nuevo}" class="btn btn-exito"><i class="fa-solid fa-box-open"></i>Nuevo producto

				</a>
			</div>
			<form th:action="@{/productos}"
			      method="get"
			      class="barra-superior">

			    <!-- BUSCADOR -->

			    <input type="text"

			           name="buscar"

			           th:value="${param.buscar}"

			           placeholder="Buscar producto..."

			           class="input-busqueda">

			    <!-- FILTROS -->

			    <div class="filtros">

			        <select name="categoriaId"
			                class="select-filtro"
			                onchange="this.form.submit()">

			            <option value="">
			                Todas las categorías
			            </option>

			            <option th:each="c : ${categorias}"

			                    th:value="${c.id}"

			                    th:text="${c.nombre}"

			                    th:selected="${param.categoriaId != null
			                    and param.categoriaId[0] == c.id.toString()}">

			            </option>

			        </select>

					<button type="submit" class="btn-buscar">
					    <i class="fa-solid fa-magnifying-glass"></i>
					    Buscar
					</button>

			    </div>

			</form>

			<div class="contenedor">

				<section class="panel">

					<table class="tabla">

						<thead>

						    <tr>

						        <th>Código</th>

						        <th>Producto</th>

						        <th>Categoría</th>

						        <th>Stock actual</th>

						        <th>Nivel</th>

						        <th>Estado</th>

						        <th>Acciones</th>

						    </tr>

						</thead>

						<tbody>

						    <tr th:each="p : ${productos}">

						        <!-- Código -->

						        <td th:text="${p.codigo}"></td>

						        <!-- Producto -->

						        <td>

						            <div class="producto-info">

						                <strong th:text="${p.nombre}"></strong>

						                <small th:text="'Zona: ' + ${p.zona}"></small>

						            </div>

						        </td>

						        <!-- Categoría -->

						        <td th:text="${p.categoria.nombre}"></td>

						        <!-- Stock -->

						        <td>

						            <span class="stock-numero"
						                  th:text="${p.stock}">

						            </span>

						        </td>

						        <!-- Nivel -->

						        <td>

						            <span class="badge-nivel"

						                  th:classappend="${p.stock <= p.stockMinimo}
						                  ? 'nivel-bajo'
						                  : 'nivel-ok'"

						                  th:text="${p.stock <= p.stockMinimo}
						                  ? 'Bajo'
						                  : 'Óptimo'">

						            </span>

						        </td>

						        <!-- Estado -->

						        <td>

						            <span class="badge-estado"

						                  th:classappend="${p.stock == 0}
						                  ? 'estado-agotado'
						                  : 'estado-activo'"

						                  th:text="${p.stock == 0}
						                  ? 'Agotado'
						                  : 'Disponible'">

						            </span>

						        </td>

						        <!-- Acciones -->

						        <td>

									<div class="acciones">

									    <a th:if="${#authentication.authorities.![authority].contains('ROLE_ADMINISTRADOR')}"
									       th:href="@{/productos/editar/{id}(id=${p.id})}"
									       class="btn-icono btn-editar"
									       title="Editar producto">

									        <i class="fa-solid fa-pen-to-square"></i>

									    </a>

									    <form th:if="${#authentication.authorities.![authority].contains('ROLE_ADMINISTRADOR')}"
									          th:action="@{/productos/eliminar/{id}(id=${p.id})}"
									          method="post"
									          onsubmit="return confirm('¿Seguro que deseas eliminar este producto?')">

									        <button type="submit"
									                class="btn-icono btn-eliminar"
									                title="Eliminar producto">

									            <i class="fa-solid fa-trash"></i>

									        </button>

									    </form>

									</div>

						        </td>

						    </tr>

						</tbody>

					</table>

				</section>
			</div>

		</main>

	</div>

</body>

</html>
